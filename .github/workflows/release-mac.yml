# Mac 版の配布（インストーラー .pkg と、自動更新の元になる GitHub Release）を作る。
#
# 版は Windows 版と共通（windows/package.json の "version"）。version を上げて main に push すると、
#   1. その版の Release（タグ v<version>）に CampusHub-<version>.pkg がまだ無ければ
#   2. テスト → scripts/build-pkg.sh で .pkg をビルド → 同じ Release に上げる（Release が無ければ作る）
# Windows 版（release-windows.yml）と同じ Release に相乗りする。どちらが先に Release を作ってもよい。
# インストール済みの Mac 版は Release の CampusHub-<version>.pkg（SHA-256）を見て新しい版に気づき、更新を知らせる。
# version を上げていない push では何もしない（同じ版の Release に .pkg があればスキップ）。
# 途中で失敗したときは Actions →「Mac 版をリリース」→ Run workflow で上げ直せる。
name: Mac 版をリリース

on:
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'Package.swift'
      - 'packaging/**'
      - 'scripts/build-app.sh'
      - 'scripts/build-pkg.sh'
      - 'windows/package.json'
      - '.github/workflows/release-mac.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-mac
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: 版を確認
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -p "require('./windows/package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null | grep -qx "CampusHub-$v.pkg"; then
            echo "v$v の Release にはもう .pkg があるので、何もしません（配るには windows/package.json の version を上げてください）"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "v$v の Mac 版をリリースします"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: テスト
        if: steps.ver.outputs.skip == 'false'
        run: swift test

      - name: ビルド
        if: steps.ver.outputs.skip == 'false'
        run: ./scripts/build-pkg.sh

      - name: Release に上げる
        if: steps.ver.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          pkg="dist/CampusHub-$V.pkg"
          ls -la "$pkg"
          lipo -archs "build/キャンパスハブ.app/Contents/MacOS/CampusHub"
          # Windows 版のワークフローが同時に Release を作ることがあるので、作れなければ（もうあれば）上げるだけにする
          if ! gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "v$V" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "v$V" --generate-notes \
              || gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null
          fi
          gh release upload "v$V" "$pkg" --clobber --repo "$GITHUB_REPOSITORY"
